name: Build dev

on:
    push:
        branches:
            - dev
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix variants/beta ci
                  npm --prefix variants/stable ci

            - name: Test
              run: npm test

            - name: Build
              run: npm run pack

            - name: Upload pack artifact
              uses: actions/upload-artifact@v5
              with:
                  name: dev-package
                  path: "*.tgz"
