name: Build dev

on:
    push:
        branches:
            - dev
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      variants/beta/package-lock.json
                      variants/stable/package-lock.json

            - name: Install dependencies
              run: |
                  npm config set registry https://registry.npmjs.org/
                  npm config set replace-registry-host always
                  npm ci --prefer-offline --no-audit
                  npm --prefix variants/beta ci --prefer-offline --no-audit
                  npm --prefix variants/stable ci --prefer-offline --no-audit

            - name: Test
              run: npm test

            - name: Build
              run: npm run pack

            - name: Upload pack artifact
              uses: actions/upload-artifact@v5
              with:
                  name: dev-package
                  path: "*.tgz"
