name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        # 一次 run 会同时发布 beta 与 stable，两渠道后缀 tag（如 v0.4.3-beta / v0.4.3-stable）
        # 不应再触发完整发布，以免第二次 npm publish 报 EPUBLISHCONFLICT。
        # workflow_dispatch 保持可手动运行。
        if: ${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix variants/beta ci
                  npm --prefix variants/stable ci

            - name: Test
              run: npm test

            - name: Build package
              run: npm run pack

            - name: Create GitHub Release
              # 手动触发时没有 tag，action-gh-release 无法创建 release；仅推 tag 时执行。
              # 已存在的 release 会被更新资产，但正文等未显式指定的信息会保留原样。
              if: ${{ github.ref_type == 'tag' }}
              uses: softprops/action-gh-release@v3
              with:
                  files: "*.tgz"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 双渠道发布：beta 版本占用 latest，并同步 beta 别名；stable 版本使用 stable 标签。
            # 需在仓库 Secrets 配置 NPM_TOKEN（有发布权限）；未配置则跳过。
            # secrets 上下文不能用于 step 级 if（报 Unrecognized named-value），先经 env 读出是否配置，
            # 再用 steps.<id>.outputs 作为发布步骤的闸门
            - name: Check NPM_TOKEN configured
              id: npm_token
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi

            - name: Publish to npm (beta -> latest)
              if: ${{ steps.npm_token.outputs.configured == 'true' }}
              run: |
                  npm publish ./variants/beta --tag latest
                  BETA_VERSION=$(node -p "require('./variants/beta/package.json').version")
                  npm dist-tag add "sapi-pro@$BETA_VERSION" beta
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm (stable -> stable tag)
              if: ${{ steps.npm_token.outputs.configured == 'true' }}
              run: npm publish ./variants/stable --tag stable
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
