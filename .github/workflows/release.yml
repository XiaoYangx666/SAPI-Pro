name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write
    # npm Trusted Publishing (OIDC) 需要：GitHub 用短期 OIDC token 换发布凭证，不再需要 NPM_TOKEN。
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        # 一次 run 会同时发布 beta 与 stable，两渠道后缀 tag（如 v0.4.3-beta / v0.4.3-stable）
        # 不应再触发完整发布，以免第二次 npm publish 报 EPUBLISHCONFLICT。
        # workflow_dispatch 保持可手动运行。
        if: ${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix variants/beta ci
                  npm --prefix variants/stable ci

            - name: Test
              run: npm test

            - name: Build package
              run: npm run pack

            - name: Create GitHub Release
              # 手动触发时没有 tag，action-gh-release 无法创建 release；仅推 tag 时执行。
              # 已存在的 release 会被更新资产，但正文等未显式指定的信息会保留原样。
              if: ${{ github.ref_type == 'tag' }}
              uses: softprops/action-gh-release@v3
              with:
                  files: "*.tgz"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 双渠道发布走 npm Trusted Publishing (OIDC)，无需 NPM_TOKEN：
            #   npm 包设置里添加 Trusted Publisher（XiaoYangx666 / SAPI-Pro / release.yml），
            #   并勾选允许 npm publish 与 npm dist-tag。
            # dist-tag 的 OIDC 支持要求 npm >= 11.21.0，Node 24 自带的 npm 版本不够，先升级。
            - name: Upgrade npm for OIDC dist-tag support
              run: npm install -g npm@11.21.3

            - name: Publish to npm (beta -> latest)
              run: |
                  npm publish ./variants/beta --tag latest
                  BETA_VERSION=$(node -p "require('./variants/beta/package.json').version")
                  npm dist-tag add "sapi-pro@$BETA_VERSION" beta

            - name: Publish to npm (stable -> stable tag)
              run: npm publish ./variants/stable --tag stable
