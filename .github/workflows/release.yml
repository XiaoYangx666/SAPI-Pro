name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Build package
              run: npm run pack

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: "*.tgz"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
